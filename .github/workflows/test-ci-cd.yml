  soos_sast_scan:
    name: SOOS SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Run SOOS SAST Scan
        uses: soos-io/soos-sast-github-action@v1
        with:
          client_id: rfwribqyt
          api_key: NGM2NDcxZWMtZTJlNi00OGJmLWE0YjctODA1MzNiM2I5NjQ4
          project_name: ${{ github.repository }}

  soos_dast_scan:
    name: SOOS DAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Run SOOS DAST Scan
        uses: soos-io/soos-dast-github-action@v2
        with:
          client_id: rfwribqyt
          api_key: NGM2NDcxZWMtZTJlNi00OGJmLWE0YjctODA1MzNiM2I5NjQ4
          project_name: "SOOS-DAST-Scan"
          target_url: "https://master-gusa-desktop.gusadev.com"


  deployment:
    runs-on: ubuntu
    name: deploy-${{ matrix.analytics }}
    if: ${{ needs.build.result == 'skipped' || needs.build.result == 'success' || needs.build.result == null }}
    needs: [ soos_dast_scan ]
    strategy:
        matrix:
           analytics: ${{ fromJSON(needs.set-analytics.outputs.analytics) }}
    steps:
        - name: Echo
          run: echo "${{ matrix.analytics }}"


  deploy-stable-release-2:
    runs-on: ubuntu
    name: ${{ matrix.host }}-deploy
    needs: deployment
    strategy:
        matrix:
          host: [ release-2, stable ]
          isStable:
            - ${{ contains(inputs.origin, 'false') }}
          exclude:
            - isStable: false
              host: "stable"
    steps:
        - name: Run Deploy
          run: |
            echo '${{ matrix.host }}'