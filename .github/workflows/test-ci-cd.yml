      inputs:
        beta:
            type: boolean
            default: false
            description: Deploy to Beta
        origin:
            type: boolean
            default: false
            description: Deploy to Origin
        alpha:
            type: boolean
            default: false
            description: Deploy to Alpha
        production:
            type: boolean
            default: false
            description: Deploy to Production
        environment:
            description: 'Environment to run deploy'
            type: environment
            default: production

